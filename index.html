                                <rect x={cx} y={cy} width={b*scale} height={b*scale} fill="none" stroke="#93c5fd" strokeWidth="2" strokeDasharray="4 4"/>

                                        >
                                            {t.a}-{t.b}-{t.c}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <p className="text-gray-600 mb-6 font-medium leading-relaxed">
                                觀察這個 <strong>{a}-{b}-{c}</strong> 的直角三角形。我們把旁邊的 <span className="text-red-500 font-bold">a²</span> 與 <span className="text-blue-500 font-bold">b²</span> 切成了一格一格的小方塊。<br/><br/>
                                在腦中想像一下：如果把它們全部搬到斜邊上，會發生什麼事？

                            <button

                                {feedback}

            const currentSidePx = side * scale;

            const handleSolve = () => {
                setSide(Math.sqrt(10));
                setIsSolved(true);
            };

            return (
                <div className="flex flex-col items-center p-4">
                    <h3 className="text-xl font-bold mb-2 text-gray-700">{t.ch2.level3Title}</h3>

                    <div className="flex flex-col md:flex-row gap-8 items-center w-full max-w-3xl">

                            <div className="absolute border-4 border-dashed border-gray-400 rounded-sm flex items-center justify-center"
                                 style={{ width: `${targetSidePx}px`, height: `${targetSidePx}px` }}>
                                <span className="text-gray-400 font-bold text-2xl opacity-50 z-0">{t.ch2.target10}</span>

                            <div className="absolute bg-blue-500 border-2 border-white shadow-lg flex items-center justify-center opacity-80 block-transition z-10"
                                 style={{ width: `${currentSidePx}px`, height: `${currentSidePx}px` }}>

                <div className="flex flex-col items-center p-4">
                    <h3 className="text-xl font-bold mb-2 text-gray-700">{t.ch4.level3Title}</h3>
                    <p className="mb-4 text-gray-600 text-center max-w-xl text-sm md:text-base">
                        {t.ch4.level3Desc}
                    </p>

                    <div className="flex flex-col md:flex-row gap-8 items-center w-full max-w-4xl">
                        {/* 拋物線水面互動畫布 */}
                        <div className="flex-1 bg-slate-900 border-2 border-slate-700 rounded-2xl p-4 shadow-xl flex flex-col items-center relative overflow-hidden w-full">
                            <svg viewBox="0 0 320 240" className="w-full h-auto">
                                {/* 水面背景 (y <= 0) */}
                                <rect x="0" y={cy} width="320" height={240 - cy} fill="#0284c7" opacity="0.25" />
                                
                                {/* 水面基準線 y = 0 */}
                                <line x1="0" y1={cy} x2="320" y2={cy} stroke="#38bdf8" strokeWidth="2" strokeDasharray="4 4" />
                                <text x="10" y={cy - 6} fill="#38bdf8" className="text-xs font-mono font-bold">y = 0 (水面)</text>

                                {/* 拋物線 */}
                                <path d={pathData} fill="none" stroke="#f59e0b" strokeWidth="3" className="block-transition" />

                                {/* 頂點標示 */}
                                <circle cx={cx} cy={cy - (c - 4) * scaleY} r="5" fill="#ef4444" className="block-transition" />

                                {/* 交點標示水花 */}
                                {discriminant > 0 && (
                                    <>
                                        <circle cx={cx - Math.sqrt(discriminant)/2 * scaleX} cy={cy} r="6" fill="#22c55e" className="pop-in" />
                                        <circle cx={cx + Math.sqrt(discriminant)/2 * scaleX} cy={cy} r="6" fill="#22c55e" className="pop-in" />
                                    </>
                                )}

                                {discriminant === 0 && (
                                    <circle cx={cx} cy={cy} r="6" fill="#22c55e" className="pop-in" />
                                )}
                            </svg>

                            {/* 即時狀態徽章 */}
                            <div className="mt-3 text-center">
                                <span className={`px-4 py-1.5 rounded-full font-bold text-sm ${discriminant > 0 ? 'bg-green-900/60 text-green-300 border border-green-500' : discriminant === 0 ? 'bg-yellow-900/60 text-yellow-300 border border-yellow-500' : 'bg-blue-900/60 text-blue-300 border border-blue-500'}`}>
                                    {discriminant > 0 ? t.ch4.status2Roots : discriminant === 0 ? t.ch4.status1Root : t.ch4.status0Roots}
                                </span>
                            </div>
                        </div>

                        {/* 控制面板 */}
                        <div className="flex-1 w-full bg-white p-6 rounded-xl shadow border border-gray-200 space-y-4">
                            <div>
                                <label className="block text-gray-700 font-bold mb-2">
                                    {t.ch4.adjustC} <span className="font-mono text-xl text-amber-600">{c}</span>
                                </label>
                                <input
                                    type="range" min="1" max="7" step="1"
                                    value={c}
                                    onChange={(e) => setC(parseInt(e.target.value))}
                                    className="w-full cursor-pointer accent-amber-500 h-2 bg-gray-200 rounded-lg"
                                />
                                <div className="flex justify-between text-xs font-mono text-gray-400 mt-2 px-1">
                                    <span>c=1 (Δ=12)</span>
                                    <span className="font-bold text-yellow-600">c=4 (Δ=0 重根)</span>
                                    <span>c=7 (Δ=-12)</span>
                                </div>
                            </div>

                            <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 font-mono text-sm space-y-2">
                                <p className="text-gray-600">{t.ch4.equationDisplay.replace('{c}', c)}</p>
                                <p className="font-bold text-gray-800">
                                    {t.ch4.discriminantText.replace('{c}', c)}{' '}
                                    <span className={`text-lg ${discriminant > 0 ? 'text-green-600' : discriminant === 0 ? 'text-yellow-600' : 'text-blue-600'}`}>
                                        {discriminant}
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Chapter4App = ({ onBack, lang, setLang, t }) => {
            const [activeTab, setActiveTab] = useState(1);

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8">
                    <div className="flex items-center justify-between mb-6">
                        <button onClick={onBack} className="text-blue-600 hover:text-blue-800 flex items-center font-semibold transition-colors">
                            <span>{t.backToMenu}</span>
                        </button>
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800">{t.ch4 ? t.ch4.title : "CH4"}</h2>
                        <LanguageSelector currentLang={lang} onSelectLang={setLang} />
                    </div>

                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                        <div className="flex border-b border-gray-200 bg-gray-50 overflow-x-auto">
                            {[
                                { id: 1, name: t.ch4.tab1 },
                                { id: 2, name: t.ch4.tab2 },
                                { id: 3, name: t.ch4.tab3 }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-4 px-2 text-center font-bold text-sm md:text-lg transition-colors whitespace-nowrap ${
                                        activeTab === tab.id
                                            ? 'bg-white text-blue-600 border-b-4 border-blue-600'
                                            : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'
                                    }`}
                                >
                                    {tab.name}
                                </button>
                            ))}
                        </div>

                        <div className="p-6 bg-white min-h-[400px]">
                            {activeTab === 1 && <Chapter4Level1 t={t} />}
                            {activeTab === 2 && <Chapter4Level2 t={t} />}
                            {activeTab === 3 && <Chapter4Level3 t={t} />}
                        </div>
                    </div>
                </div>
            );
        };

const App = () => {
            const [currentView, setCurrentView] = useState('menu');
            const [lang, setLang] = useState('zh');
            const t = TRANSLATIONS[lang] || TRANSLATIONS.zh;

            useEffect(() => {
                if (t && t.siteTitle) {
                    document.title = t.siteTitle;
                }
            }, [lang, t]);

            return (
                <div className="font-sans">
                    {currentView === 'menu' ? (
                        <MainMenu onSelectChapter={(id) => setCurrentView(id)} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch1' ? (
                        <Chapter1App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch2' ? (
                        <Chapter2App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch3' ? (
                        <Chapter3App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch4' ? (
                        <Chapter4App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
