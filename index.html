<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherry's Math - 國二數學互動教具平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="translations.js"></script>
    
    <style>
        .block-transition {
            transition: all 0.5s ease-in-out;
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const LanguageSelector = ({ currentLang, onSelectLang }) => {
            const languages = [
                { id: "zh", label: "繁中", flag: "🇹🇼" },
                { id: "en", label: "EN", flag: "🇬🇧" },
                { id: "fr", label: "FR", flag: "🇫🇷" },
            ];
            return (
                <div className="inline-flex items-center bg-white/90 backdrop-blur-md rounded-full p-1 shadow border border-gray-200">
                    {languages.map(l => (
                        <button
                            key={l.id}
                            onClick={() => onSelectLang(l.id)}
                            className={`px-3 py-1 rounded-full text-xs md:text-sm font-bold transition-all duration-200 flex items-center ${
                                currentLang === l.id
                                    ? "bg-blue-600 text-white shadow"
                                    : "text-gray-600 hover:text-blue-600"
                            }`}
                        >
                            <span className="mr-1">{l.flag}</span>
                            <span>{l.label}</span>
                        </button>
                    ))}
                </div>
            );
        };


        const MainMenu = ({ onSelectChapter, lang, setLang, t }) => {
            const syllabus = [
                {
                    term: t.term1,
                    chapters: [
                        { id: "ch1", name: t.chapters.ch1, available: true },
                        { id: "ch2", name: t.chapters.ch2, available: true },
                        { id: "ch3", name: t.chapters.ch3, available: true },
                        { id: "ch4", name: t.chapters.ch4, available: true }
                    ]
                },
                {
                    term: t.term2,
                    chapters: [
                        { id: "ch5", name: t.chapters.ch5, available: false },
                        { id: "ch6", name: t.chapters.ch6, available: false },
                        { id: "ch7", name: t.chapters.ch7, available: false },
                        { id: "ch8", name: t.chapters.ch8, available: false }
                    ]
                }
            ];

            return (
                <div className="max-w-4xl mx-auto p-8">
                    <div className="flex justify-end mb-4">
                        <LanguageSelector currentLang={lang} onSelectLang={setLang} />
                    </div>
                    <header className="text-center mb-10">
                        <h1 className="text-4xl font-bold text-blue-800 mb-2">{t.appName}</h1>
                        <p className="text-gray-600">{t.appSubtitle}</p>
                    </header>
                    
                    <div className="space-y-8">
                        {syllabus.map((term, idx) => (
                            <div key={idx} className="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-500">
                                <h2 className="text-2xl font-bold text-gray-800 mb-4">{term.term}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {term.chapters.map(ch => (
                                        <button 
                                            key={ch.id}
                                            onClick={() => ch.available ? onSelectChapter(ch.id) : alert(t.comingSoonAlert)}
                                            className={`p-4 rounded-lg text-left transition-all duration-300 ${
                                                ch.available 
                                                ? "bg-blue-50 hover:bg-blue-100 hover:shadow-md hover:-translate-y-1 border border-blue-200 cursor-pointer" 
                                                : "bg-gray-50 text-gray-400 border border-gray-200 cursor-not-allowed"
                                            }`}
                                        >
                                            <h3 className={`font-semibold text-lg ${ch.available ? 'text-blue-700' : 'text-gray-400'}`}>
                                                {ch.name}
                                            </h3>
                                            <p className="text-sm mt-1">
                                                {ch.available ? t.clickToEnter : t.underConstruction}
                                            </p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Level1 = ({ t }) => {
            const [a, setA] = useState(4);
            const [b, setB] = useState(2);
            
            // 使用相對單位讓畫面自適應
            const scale = 30; // 稍微放大比例讓標示更清晰
            const totalWidth = (a + b) * scale;
            const offset = 110; // 加大預留空間，避免文字重疊

            return (
                <div className="flex flex-col items-center p-4">
                    <h3 className="text-xl font-bold mb-4 text-gray-700">{t.ch1.level1Title}</h3>
                    
                    <div className="flex flex-col md:flex-row gap-8 items-center w-full max-w-4xl">
                        {/* 左側：視覺化圖形 */}
                        <div className="flex-1 flex justify-center border-2 border-dashed border-gray-300 p-8 rounded-lg bg-gray-50 overflow-hidden">
                            {/* 加入預留空間的相對定位容器 */}
                            <div className="relative" style={{ width: `${totalWidth + offset}px`, height: `${totalWidth + offset}px` }}>
                                
                                {/* 頂部外圍邊長標示 */}
                                <div className="absolute top-0 block-transition" style={{ left: `${offset}px`, width: `${totalWidth}px`, height: `${offset}px` }}>
                                    <div className="absolute top-2 w-full flex justify-center">
                                        <div className="font-bold text-gray-800 whitespace-nowrap text-lg">{t.ch1.sideLength} {a + b}</div>
                                    </div>
                                    <div className="relative w-full h-full">
                                        {/* a 的標示線 */}
                                        <div className="absolute bottom-[10px] left-0 border-x-2 border-t-2 border-gray-400 block-transition flex justify-center" style={{ width: `${a*scale}px`, height: '15px' }}>
                                            <span className="absolute bottom-[20px] text-sm font-bold text-red-500 whitespace-nowrap">a = {a}</span>
                                        </div>
                                        {/* b 的標示線 */}
                                        <div className="absolute bottom-[10px] border-x-2 border-t-2 border-gray-400 block-transition flex justify-center" style={{ left: `${a*scale}px`, width: `${b*scale}px`, height: '15px' }}>
                                            <span className="absolute bottom-[20px] text-sm font-bold text-blue-500 whitespace-nowrap">b = {b}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 左側外圍邊長標示 */}
                                <div className="absolute left-0 block-transition" style={{ top: `${offset}px`, height: `${totalWidth}px`, width: `${offset}px` }}>
                                    {/* 使用 Flex 容器與固定寬度來安全置中旋轉的文字 */}
                                    <div className="absolute left-2 top-0 w-[40px] h-full flex items-center justify-center">
                                        <div className="-rotate-90 font-bold text-gray-800 whitespace-nowrap text-lg">{t.ch1.sideLength} {a + b}</div>
                                    </div>
                                    <div className="relative w-full h-full">
                                        {/* a 的標示線 */}
                                        <div className="absolute top-0 right-[10px] border-y-2 border-l-2 border-gray-400 block-transition flex items-center" style={{ height: `${a*scale}px`, width: '15px' }}>
                                            <span className="absolute right-[25px] text-sm font-bold text-red-500 whitespace-nowrap">a = {a}</span>
                                        </div>
                                        {/* b 的標示線 */}
                                        <div className="absolute right-[10px] border-y-2 border-l-2 border-gray-400 block-transition flex items-center" style={{ top: `${a*scale}px`, height: `${b*scale}px`, width: '15px' }}>
                                            <span className="absolute right-[25px] text-sm font-bold text-blue-500 whitespace-nowrap">b = {b}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 大正方形本體 */}
                                <div 
                                    style={{ width: `${totalWidth}px`, height: `${totalWidth}px`, top: `${offset}px`, left: `${offset}px` }} 
                                    className="absolute block-transition shadow-lg"
                                >
                                    {/* a^2 (紅) */}
                                    <div className="absolute top-0 left-0 bg-red-400 flex items-center justify-center text-white font-bold text-xl block-transition border border-white"
                                         style={{ width: `${a*scale}px`, height: `${a*scale}px` }}>a²</div>
                                    {/* ab (綠, 右上) */}
                                    <div className="absolute top-0 right-0 bg-green-400 flex items-center justify-center text-white font-bold text-xl block-transition border border-white"
                                         style={{ left: `${a*scale}px`, width: `${b*scale}px`, height: `${a*scale}px` }}>ab</div>
                                    {/* ab (綠, 左下) */}
                                    <div className="absolute bottom-0 left-0 bg-green-400 flex items-center justify-center text-white font-bold text-xl block-transition border border-white"
                                         style={{ top: `${a*scale}px`, width: `${a*scale}px`, height: `${b*scale}px` }}>ab</div>
                                    {/* b^2 (藍) */}
                                    <div className="absolute bottom-0 right-0 bg-blue-400 flex items-center justify-center text-white font-bold text-xl block-transition border border-white"
                                         style={{ top: `${a*scale}px`, left: `${a*scale}px`, width: `${b*scale}px`, height: `${b*scale}px` }}>b²</div>
                                </div>
                            </div>
                        </div>

                        {/* 右側：控制面板 */}
                        <div className="flex-1 bg-white p-6 rounded-lg shadow w-full">
                            <div className="mb-6">
                                <label className="block text-gray-700 font-bold mb-2">{t.ch1.adjustA} {a}</label>
                                <input type="range" min="1" max="5" value={a} onChange={(e) => setA(parseInt(e.target.value))} className="w-full cursor-pointer accent-red-500" />
                            </div>
                            <div className="mb-6">
                                <label className="block text-gray-700 font-bold mb-2">{t.ch1.adjustB} {b}</label>
                                <input type="range" min="1" max="5" value={b} onChange={(e) => setB(parseInt(e.target.value))} className="w-full cursor-pointer accent-blue-500" />
                            </div>
                            <div className="bg-blue-50 p-4 rounded text-sm text-blue-800 leading-relaxed">
                                {t.ch1.tipAha}<br/>
                                <span className="font-bold text-red-600">{t.ch1.oneA2}</span>、<span className="font-bold text-blue-600">{t.ch1.oneB2}</span>{t.ch1.and}<span className="font-bold text-green-600">{t.ch1.twoAB}</span>！
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Level2 = ({ t }) => {
            const [blocks, setBlocks] = useState({ a2: false, b2: false, ab1: false, ab2: false });
            const [step, setStep] = useState(0);
            
            const handlePlaceFirstTwo = () => {
                setBlocks({ ...blocks, a2: true, b2: true });
                setStep(1);
            };

            const handlePlaceLastTwo = () => {
                setBlocks({ a2: true, b2: true, ab1: true, ab2: true });
                setStep(2);
            };

            const reset = () => {
                setBlocks({ a2: false, b2: false, ab1: false, ab2: false });
                setStep(0);
            };

            return (
                <div className="flex flex-col items-center p-4">
                    <h3 className="text-xl font-bold mb-4 text-gray-700">{t.ch1.level2Title}</h3>
                    <div className="flex flex-col md:flex-row gap-8 w-full max-w-4xl">
                        <div className="flex-1 flex justify-center bg-gray-50 border-2 border-gray-200 p-8 rounded-lg">
                            <div className="relative w-[250px] h-[250px] border-4 border-dashed border-gray-400 bg-white">
                                <div className="absolute -top-8 w-full text-center font-bold text-gray-600">{t.ch1.targetSide}</div>
                                <div className={`absolute top-0 left-0 w-[150px] h-[150px] bg-red-400 border border-white flex items-center justify-center text-white font-bold text-xl block-transition ${blocks.a2 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>3²</div>
                                <div className={`absolute bottom-0 right-0 w-[100px] h-[100px] bg-blue-400 border border-white flex items-center justify-center text-white font-bold text-xl block-transition ${blocks.b2 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>2²</div>
                                <div className={`absolute top-0 right-0 w-[100px] h-[150px] bg-green-400 border border-white flex items-center justify-center text-white font-bold text-xl block-transition ${blocks.ab1 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>3×2</div>
                                <div className={`absolute bottom-0 left-0 w-[150px] h-[100px] bg-green-400 border border-white flex items-center justify-center text-white font-bold text-xl block-transition ${blocks.ab2 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>3×2</div>
                            </div>
                        </div>

                        <div className="flex-1 bg-white p-6 rounded-lg shadow">
                            <div className="mb-6">
                                <p className="text-gray-700 font-bold mb-4">{t.ch1.questionPrompt}</p>
                                
                                {step === 0 && (
                                    <div className="space-y-4 pop-in">
                                        <p className="text-sm text-gray-600">{t.ch1.step0Desc}</p>
                                        <button onClick={handlePlaceFirstTwo} className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow">
                                            {t.ch1.step0Btn}
                                        </button>
                                    </div>
                                )}

                                {step === 1 && (
                                    <div className="space-y-4 pop-in">
                                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4">
                                            <p className="text-yellow-800 font-bold">{t.ch1.step1NoticeTitle}</p>
                                            <p className="text-sm text-yellow-700 mt-1">{t.ch1.step1NoticeDesc}</p>
                                        </div>
                                        <button onClick={handlePlaceLastTwo} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded shadow animate-pulse">
                                            {t.ch1.step1Btn}
                                        </button>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div className="space-y-4 pop-in">
                                        <div className="bg-green-50 border-l-4 border-green-400 p-4">
                                            <p className="text-green-800 font-bold text-lg">{t.ch1.step2SuccessTitle}</p>
                                            <p className="text-sm text-green-700 mt-2">{t.ch1.step2Formula}<br/>
                                                <span className="font-mono text-base">(3+2)² = 3² + 2×(3×2) + 2²</span>
                                            </p>
                                        </div>
                                        <button onClick={reset} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">
                                            {t.ch1.step2Btn}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Chapter1App = ({ onBack, lang, setLang, t }) => {
            const [activeTab, setActiveTab] = useState(1);

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8">
                    <div className="flex items-center justify-between mb-6">
                        <button onClick={onBack} className="text-blue-600 hover:text-blue-800 flex items-center font-semibold transition-colors">
                            <span>{t.backToMenu}</span>
                        </button>
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800">{t.ch1 ? t.ch1.title : "CH1"}</h2>
                        <LanguageSelector currentLang={lang} onSelectLang={setLang} />
                    </div>

                    <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                        <div className="flex border-b border-gray-200 bg-gray-50 overflow-x-auto">
                            {[
                                { id: 1, name: t.ch1.tab1 }, 
                                { id: 2, name: t.ch1.tab2 }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-4 px-2 text-center font-bold text-sm md:text-lg transition-colors whitespace-nowrap ${
                                        activeTab === tab.id 
                                        ? 'bg-white text-blue-600 border-b-4 border-blue-600' 
                                        : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'
                                    }`}
                                >
                                    {tab.name}
                                </button>
                            ))}
                        </div>

                        <div className="p-6 bg-white min-h-[400px]">
                            {activeTab === 1 && <Level1 t={t} />}
                            {activeTab === 2 && <Level2 t={t} />}
                        </div>
                    </div>
                </div>
            );
        };

        const Chapter2Level1 = ({ t }) => {
            const [isTransferred, setIsTransferred] = useState(false);
            const [triple, setTriple] = useState({ a: 3, b: 4, c: 5 });

            const { a, b, c } = triple;
            
            // 動態比例縮放：確保最大組(5-12-13)的圖形也能完整塞進畫布
            const targetHypotenusePx = 175; 
            const scale = targetHypotenusePx / c; 
            
            const cx = 200, cy = 260; 
            const theta = Math.atan2(a, b) * 180 / Math.PI; 

            // 產生 C 正方形 (斜邊) 的空位陣列
            const destSlots = Array.from({ length: c * c }).map((_, idx) => {
                return { col: idx % c, row: Math.floor(idx / c) };
            });

            // 產生 A 正方形 (紅) 的小方塊
            const redBlocks = Array.from({ length: a * a }).map((_, idx) => {
                return { 
                    id: `red-${idx}`, 
                    startX: cx - a * scale + (idx % a) * scale, 
                    startY: cy - a * scale + Math.floor(idx / a) * scale, 
                    dest: destSlots[idx] 
                };
            });

            // 產生 B 正方形 (藍) 的小方塊
            const blueBlocks = Array.from({ length: b * b }).map((_, idx) => {
                return { 
                    id: `blue-${idx}`, 
                    startX: cx + (idx % b) * scale, 
                    startY: cy + Math.floor(idx / b) * scale, 
                    dest: destSlots[idx + a * a] 
                };
            });

            const handleTripleChange = (newTriple) => {
                setIsTransferred(false); // 切換時歸位
                setTimeout(() => setTriple(newTriple), 300);
            };

            return (
                <div className="flex flex-col items-center p-4">
                    <h3 className="text-xl font-bold mb-4 text-gray-700">{t.ch2.level1Title}</h3>
                    
                    <div className="flex flex-col md:flex-row gap-8 items-center w-full max-w-4xl">
                        {/* 左側：SVG 視覺化 */}
                        <div className="flex-1 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 flex justify-center overflow-hidden py-8">
                            <svg viewBox="0 0 550 500" className="w-full max-w-lg h-auto">
                                
                                {/* 繪製斜邊 C 的目標空位框 (紫虛線) */}
                                {destSlots.map((slot, idx) => (
                                    <rect 
                                        key={`slot-${idx}`}
                                        width={scale} height={scale} 
                                        fill="none" stroke="#d8b4fe" strokeWidth="1" strokeDasharray="2 2"
                                        style={{ 
                                            transform: `translate(${cx}px, ${cy - a*scale}px) rotate(${theta}deg) translate(${slot.col * scale}px, ${-slot.row * scale - scale}px)` 
                                        }}
                                    />
                                ))}

                                {/* A與B正方形外框 (虛線) */}
                                <rect x={cx - a*scale} y={cy - a*scale} width={a*scale} height={a*scale} fill="none" stroke="#fca5a5" strokeWidth="2" strokeDasharray="4 4"/>
                                <rect x={cx} y={cy} width={b*scale} height={b*scale} fill="none" stroke="#93c5fd" strokeWidth="2" strokeDasharray="4 4"/>
                                
                                {/* 中央的直角三角形 */}
                                <polygon points={`${cx},${cy} ${cx},${cy - a*scale} ${cx + b*scale},${cy}`} fill="#fff" stroke="#374151" strokeWidth="3" />
                                <rect x={cx} y={cy-10} width="10" height="10" fill="none" stroke="#374151" strokeWidth="2"/>
                                
                                {/* 標示文字 */}
                                <text x={cx - a*scale/2} y={cy - a*scale - 15} textAnchor="middle" fill="#ef4444" className="font-bold">a² ({a*a}{t.ch2.blocksUnit})</text>
                                <text x={cx + b*scale/2} y={cy + b*scale + 25} textAnchor="middle" fill="#3b82f6" className="font-bold">b² ({b*b}{t.ch2.blocksUnit})</text>
                                
                                {/* C 正方形文字標示 */}
                                <text 
                                    textAnchor="middle" fill="#a855f7" className="font-bold block-transition"
                                    style={{ 
                                        transform: `translate(${cx}px, ${cy - a*scale}px) rotate(${theta}deg) translate(${(c/2) * scale}px, ${(-c/2) * scale + 6}px)`,
                                        opacity: isTransferred ? 1 : 0.4
                                    }}
                                >
                                    c² ({c*c}{t.ch2.blocksUnit})
                                </text>

                                {/* 動態紅方塊 */}
                                {redBlocks.map(blk => (
                                    <rect 
                                        key={blk.id} width={scale} height={scale} fill="#f87171" stroke="#fff" strokeWidth="1" 
                                        className="block-transition"
                                        style={{ 
                                            transform: isTransferred 
                                                ? `translate(${cx}px, ${cy - a*scale}px) rotate(${theta}deg) translate(${blk.dest.col * scale}px, ${-blk.dest.row * scale - scale}px)` 
                                                : `translate(${blk.startX}px, ${blk.startY}px) rotate(0deg) translate(0px, 0px)` 
                                        }}
                                    />
                                ))}

                                {/* 動態藍方塊 */}
                                {blueBlocks.map(blk => (
                                    <rect 
                                        key={blk.id} width={scale} height={scale} fill="#60a5fa" stroke="#fff" strokeWidth="1"
                                        className="block-transition" 
                                        style={{ 
                                            transform: isTransferred 
                                                ? `translate(${cx}px, ${cy - a*scale}px) rotate(${theta}deg) translate(${blk.dest.col * scale}px, ${-blk.dest.row * scale - scale}px)` 
                                                : `translate(${blk.startX}px, ${blk.startY}px) rotate(0deg) translate(0px, 0px)` 
                                        }}
                                    />
                                ))}
                            </svg>
                        </div>

                        {/* 右側：控制面板 */}
                        <div className="flex-1 bg-white p-6 rounded-lg shadow w-full">
                            <div className="mb-6">
                                <label className="block text-gray-700 font-bold mb-3">{t.ch2.testOtherTriangles}</label>
                                <div className="flex flex-wrap gap-2">
                                    {[
                                        { a: 3, b: 4, c: 5 },
                                        { a: 6, b: 8, c: 10 },
                                        { a: 5, b: 12, c: 13 }
                                    ].map(t => (
                                        <button 
                                            key={`${t.a}-${t.b}-${t.c}`}
                                            onClick={() => handleTripleChange(t)}
                                            className={`px-4 py-2 rounded-full font-bold border-2 transition-colors ${a === t.a && b === t.b ? 'bg-purple-100 border-purple-500 text-purple-700' : 'bg-white border-gray-300 text-gray-500 hover:border-purple-300 hover:text-purple-600'}`}
                                        >
                                            {t.a}-{t.b}-{t.c}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <p className="text-gray-600 mb-6 font-medium leading-relaxed">

        const Chapter2Level2 = ({ t }) => {

                        <Chapter2App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch3' ? (
                        <Chapter3App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : currentView === 'ch4' ? (
                        <Chapter4App onBack={() => setCurrentView('menu')} lang={lang} setLang={setLang} t={t} />
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
